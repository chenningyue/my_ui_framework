<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UI 自动化练习页</title>
</head>
<body>
  <h1>欢迎登录</h1>

  <form id="loginForm">
    <label>用户名</label>
    <input id="username" class="login-input" type="text" placeholder="请输入用户名"><br>

    <label>密码</label>
    <input id="password" class="login-input" type="password" placeholder="请输入密码"><br>

    <button id="loginBtn" type="submit">登录</button>
  </form>

  <p><a id="helpLink" href="#">忘记密码？</a></p>

  <p id="result"></p>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var u = document.getElementById('username').value;
      var p = document.getElementById('password').value;
      if (u && p) {
        document.getElementById('result').textContent = '登录成功，欢迎 ' + u;
      } else {
        document.getElementById('result').textContent = '用户名和密码不能为空';
      }
    });
  </script>
</body>
</html>
